name: Release

# Creates a GitHub release with all platform installers when a tag is pushed.
# Trigger: push a tag like v1.0.0

on:
  push:
    tags: ['v*']

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get

      - name: Build Android
        if: matrix.platform == 'android'
        run: flutter build apk --release

      - name: Build Windows
        if: matrix.platform == 'windows'
        run: flutter build windows --release

      - name: Build Linux
        if: matrix.platform == 'linux'
        run: flutter build linux --release

      - name: Build macOS
        if: matrix.platform == 'macos'
        run: flutter build macos --release

      - name: Package Android
        if: matrix.platform == 'android'
        run: |
          mkdir -p release/android
          cp build/app/outputs/flutter-apk/app-release.apk release/android/MIDIFlow.apk

      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          mkdir -p release/windows
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath release/windows/MIDIFlow-windows.zip

      - name: Package Linux
        if: matrix.platform == 'linux'
        run: |
          mkdir -p release/linux
          tar -czf release/linux/MIDIFlow-linux.tar.gz -C build/linux/x64/release/bundle .

      - name: Package macOS
        if: matrix.platform == 'macos'
        run: |
          mkdir -p release/macos
          cd build/macos/Build/Products/Release
          zip -qry -y "$GITHUB_WORKSPACE/release/macos/MIDIFlow-macos.zip" midiflow.app

      - uses: actions/upload-artifact@v4
        with:
          name: midiflow-${{ matrix.platform }}
          path: release/${{ matrix.platform }}/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/midiflow-android/MIDIFlow.apk
            artifacts/midiflow-windows/MIDIFlow-windows.zip
            artifacts/midiflow-linux/MIDIFlow-linux.tar.gz
            artifacts/midiflow-macos/MIDIFlow-macos.zip
          generate_release_notes: true
